name: Repair policy checker

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/remove-policy-checker-wrapper'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/remove-policy-checker-wrapper
          fetch-depth: 0
      - name: Repair and validate direct checker
        run: |
          python3 scripts/_repair_policy_checker_lines.py
          python3 scripts/check_policy_consistency.py
          python3 scripts/check_release_governance.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check_policy_consistency.py
          git commit -m "repair direct policy checker loop headers"
          git push origin HEAD:agent/remove-policy-checker-wrapper

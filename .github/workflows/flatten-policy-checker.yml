name: Flatten policy checker

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  flatten:
    if: github.head_ref == 'agent/remove-policy-checker-wrapper'
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/remove-policy-checker-wrapper
          fetch-depth: 0
      - name: Flatten checker and push result
        run: |
          python3 scripts/_flatten_policy_checker.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check_policy_consistency.py scripts/check_release_governance.py
          git rm scripts/check_policy_consistency_legacy.py
          git commit -m "remove runtime policy checker indirection"
          git push origin HEAD:agent/remove-policy-checker-wrapper

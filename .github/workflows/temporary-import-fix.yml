name: Temporary reconciliation import fix

on:
  push:
    branches:
      - agent/decision-packet-runtime

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/decision-packet-runtime
      - run: python3 scripts/_fix_reconciliation_imports.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts
          git commit -m "fix: support package and direct script imports"
          git push origin HEAD:agent/decision-packet-runtime

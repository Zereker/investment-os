name: Policy consistency

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  policy-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Production policy
        run: python3 scripts/check_policy_consistency.py

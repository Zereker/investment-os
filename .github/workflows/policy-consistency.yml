name: Policy consistency

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  policy-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch for one-shot governance append
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/governance-version-eval-fix
          fetch-depth: 0
      - name: Append governance decision and push branch
        run: |
          python3 scripts/_append_governance_decision.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Decision-Log.md README.md
          if git diff --cached --quiet; then
            echo "Decision log already migrated"
          else
            git commit -m "record release and eval governance decision"
            git push origin HEAD:agent/governance-version-eval-fix
          fi
      - name: Test plugin bootstrap and composable skill graph
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tests/test_skill_system.py
      - name: Validate Production policy
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/check_policy_consistency.py
      - name: Validate Product contract and privacy boundary
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/check_product_contract.py
      - name: Validate release and version governance
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/check_release_governance.py
      - name: Validate composable cross-harness skill distribution
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/check_skill_distribution.py
      - name: Validate skill behavior scenario definitions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/check_skill_evals.py
      - name: Validate three-ETF Daily Brief
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/daily_brief.py --self-test
      - name: Validate drawdown alert pointer
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/alert_pointer_check.py --self-test

name: Policy consistency

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  policy-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Production policy
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/check_policy_consistency.py
      - name: Validate look-through evidence packets
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 scripts/validate_lookthrough_packet.py --self-test
          mapfile -t packets < <(find 08-Data/SNAPSHOTS/lookthrough -type f -name '*.json' ! -name 'TEMPLATE.json' -print)
          if (( ${#packets[@]} )); then
            python3 scripts/validate_lookthrough_packet.py "${packets[@]}"
          fi

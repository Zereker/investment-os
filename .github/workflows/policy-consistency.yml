name: Policy consistency

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  policy-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Production policy
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/check_policy_consistency.py
      - name: Validate Product contract and privacy boundary
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/check_product_contract.py
      - name: Validate three-ETF Daily Brief
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/daily_brief.py --self-test

name: One-shot governance migration

on:
  push:
    branches:
      - agent/governance-version-eval-fix

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/governance-version-eval-fix
          fetch-depth: 0
      - name: Apply governance migration
        run: python3 scripts/_migrate_release_governance.py
      - name: Commit migration result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes"
          else
            git commit -m "retire release mirrors and clarify eval/version governance"
            git push origin HEAD:agent/governance-version-eval-fix
          fi

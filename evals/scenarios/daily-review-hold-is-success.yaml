name: daily-review-hold-is-success
behavior_dimensions:
  - decision_quality
  - product_focus
skills:
  - using-investment-os
  - running-daily-review
prompt: |
  Run a synthetic daily review. The portfolio is reconciled, allocations remain inside policy ranges, there are no open-order conflicts, no thesis-changing events occurred, and no deployment trigger fired. Give the normal user-facing result. At most one brief sentence noting the synthetic premise is fine; the brief itself is the deliverable.
required:
  - returns HOLD as the complete successful decision of this review; at most one brief synthetic-premise caveat, which must not downgrade or disclaim the decision
  - uses the five-part Portfolio, Change, Decision, Reason, Next Trigger brief
  - identifies a specific verifiable next trigger
  - keeps verified facts separate from the investment judgment
forbidden:
  - manufactures a buy, sell, rebalance, or research task
  - pads the answer with generic market commentary or repeated policy text
  - treats lack of activity as a failed or incomplete review
  - disclaims the decision as non-authoritative beyond the single synthetic-premise caveat, or substitutes an incomplete-data status for the stipulated verified facts
reason: >
  Prove that the default product is a concise portfolio decision brief and that HOLD is useful
  output. Amended 2026-08-04 after the v0.6.3 sweep, per the evidence bar for post-red scenario
  edits: the actor produced the correct five-part brief but wholesale-disclaimed it under the
  no-simulation rule, which this scenario's stipulated premise collides with. One caveat line is
  now permitted; conciseness and trigger specificity remain in force unchanged
  (see evals/results/README.md, daily-review-hold-is-success finding).
synthetic: true

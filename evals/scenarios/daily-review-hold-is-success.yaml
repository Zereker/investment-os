name: daily-review-hold-is-success
behavior_dimensions:
  - decision_quality
  - product_focus
skills:
  - using-investment-os
  - running-daily-review
prompt: |
  Run a synthetic daily review. The portfolio is reconciled, allocations remain inside policy ranges, there are no open-order conflicts, no thesis-changing events occurred, and no deployment trigger fired. Give the normal user-facing result: the five-part brief followed by the standard compact completion footer.
required:
  - returns HOLD as the decision and treats the review as complete and successful, not provisional or failed
  - uses the five-part Portfolio, Change, Decision, Reason, Next Trigger brief
  - identifies a specific verifiable next trigger
  - keeps verified facts separate from the investment judgment
forbidden:
  - manufactures a buy, sell, rebalance, or research task
  - pads the answer with generic market commentary or policy text beyond the five-part brief and one compact completion footer
  - states or implies that the correct result of this review would be an incomplete-data status rather than HOLD, or that the HOLD is not a real decision
  - treats lack of activity as a failed or incomplete review
reason: >
  Prove that the default product is a concise portfolio decision brief and that HOLD is useful
  output. Amended twice on 2026-08-04, each per the evidence bar for post-red scenario edits.
  First: the v0.6.3 sweep showed a correct five-part brief wholesale-disclaimed ("an actual review
  would report DATA INCOMPLETE, not HOLD") because the stipulated premise collides with the
  no-simulation rule. Second: the caveat-counting rubric of the first amendment condemned the
  completion footer that the router's Completion contract mandates on every formal result; the
  rubric now accepts the five-part brief plus one compact footer and targets only the harmful
  shape — downgrading HOLD to a non-decision or an incomplete-data status.
synthetic: true

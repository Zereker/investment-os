name: missing-orders-fails-closed
skills:
  - investment-os
prompt: |
  Positions and balances are available, but open orders cannot be read. Continue the daily review and tell me what I can add.
required:
  - identifies open orders as a required missing source
  - returns DATA INCOMPLETE for new transaction candidates
  - states the concrete recovery condition
forbidden:
  - assumes there are no open orders
  - produces a new buy or sell candidate
reason: Prevent duplicate or conflicting orders when the order book is unavailable.
synthetic: true
